<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Procedimentos | Sistema de Gestão Integrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #007782;
    --primary-dark: #004d55;
    --accent: #A0D228;
    --accent-dark: #7fa81f;
    --sky: #9AEFE9;
    --bg: #F1F5F4;
    --surface: #FFFFFF;
    --text: #0F2C2E;
    --text-muted: #5B6E6D;
    --border: #DCE6E4;
    --radius: 10px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body, input, button, select, textarea {
    font-family: 'Poppins', -apple-system, 'Segoe UI', sans-serif;
  }

  body { background: var(--bg); color: var(--text); min-height: 100vh; }
  code, .mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; }

  /* ---------- Barra superior ---------- */

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 0.85rem; }
  .brand-logo { height: 34px; width: auto; display: block; }
  .brand-subtitle {
    font-size: 0.7rem; color: var(--text-muted);
    border-left: 1px solid var(--border); padding-left: 0.75rem;
    line-height: 1.2; max-width: 130px;
  }

  .top-nav { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
  .top-nav a {
    text-decoration: none;
    color: var(--text-muted);
    font-size: 0.87rem;
    font-weight: 500;
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .top-nav a:hover { background: var(--bg); color: var(--text); }
  .top-nav a.current {
    background: rgba(0,119,130,0.1);
    color: var(--primary-dark);
    font-weight: 600;
  }
  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-dark); }

  .top-actions { display: flex; align-items: center; gap: 0.7rem; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-muted); font-size: 1rem;
  }
  .icon-btn:hover { border-color: var(--primary); color: var(--primary); }

  .user-chip {
    display: flex; align-items: center; gap: 0.5rem;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 0.35rem 0.8rem 0.35rem 0.4rem;
    font-size: 0.85rem; font-weight: 600; color: var(--text);
  }
  .user-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700;
  }

  /* ---------- Banner ---------- */

  .banner {
    background: linear-gradient(120deg, var(--primary-dark), var(--primary) 65%);
    color: white;
    padding: 2.4rem 1.75rem 2.6rem;
  }
  .banner-inner { max-width: 1180px; margin: 0 auto; }
  .banner-eyebrow { color: var(--sky); font-size: 0.82rem; margin-bottom: 0.3rem; }
  .banner h1 { font-size: 1.7rem; font-weight: 700; }

  /* ---------- Conteúdo ---------- */

  .content { max-width: 1180px; margin: -1.4rem auto 2.5rem; padding: 0 1.75rem; }

  .toolbar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.8rem 1rem;
    display: flex;
    gap: 1rem;
    align-items: center;
    box-shadow: 0 8px 22px rgba(15,44,46,0.06);
    margin-bottom: 1.4rem;
  }
  .search-field {
    flex: 1;
    display: flex; align-items: center; gap: 0.6rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.5rem 1rem;
    background: var(--bg);
  }
  .search-field svg { flex-shrink: 0; color: var(--text-muted); }
  .search-field input {
    border: none; outline: none; background: none;
    width: 100%; font-size: 0.9rem; color: var(--text);
  }

  .view-toggle { display: flex; gap: 4px; background: var(--bg); border-radius: 999px; padding: 4px; }
  .view-toggle button {
    border: none; background: none; width: 34px; height: 30px;
    border-radius: 999px; cursor: pointer; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
  }
  .view-toggle button.active { background: var(--primary); color: white; }

  /* ---------- Categorias (acordeão) ---------- */

  .category {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 0.7rem;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(15,44,46,0.04);
  }

  .category-head {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.95rem 1.15rem;
    cursor: pointer;
    user-select: none;
  }
  .category-head:hover { background: rgba(0,119,130,0.04); }

  .category-index {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--primary); color: white;
    font-size: 0.78rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .category-title { flex: 1; font-size: 0.95rem; font-weight: 600; color: var(--text); }
  .category-count {
    font-size: 0.75rem; color: var(--text-muted);
    background: var(--bg); padding: 2px 10px; border-radius: 999px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .chevron { transition: transform 0.18s ease; color: var(--text-muted); }
  .category.open .chevron { transform: rotate(90deg); color: var(--primary); }

  .category-body { display: none; padding: 0 1.15rem 1.1rem; }
  .category.open .category-body { display: block; }

  .empty-state { text-align: center; padding: 1.6rem; color: var(--text-muted); font-size: 0.86rem; }

  /* lista */
  .doc-list .doc-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding: 0.75rem 0.85rem;
    border: 1px solid var(--border); border-radius: 8px;
    margin-top: 0.55rem; cursor: pointer;
  }
  .doc-list .doc-row:hover { border-color: var(--primary); background: var(--bg); }
  .doc-code {
    font-size: 0.68rem; color: var(--primary); background: rgba(0,119,130,0.08);
    padding: 1px 7px; border-radius: 4px; display: inline-block; margin-bottom: 4px;
  }
  .doc-title { font-size: 0.9rem; font-weight: 600; }
  .doc-meta { font-size: 0.76rem; color: var(--text-muted); }
  .doc-open { font-size: 0.78rem; color: var(--primary); font-weight: 600; white-space: nowrap; }

  /* grade */
  .doc-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
    gap: 0.7rem; margin-top: 0.55rem;
  }
  .doc-card {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 0.9rem; cursor: pointer; display: flex; flex-direction: column; gap: 0.35rem;
  }
  .doc-card:hover { border-color: var(--primary); background: var(--bg); }
  .doc-card-icon {
    width: 34px; height: 34px; border-radius: 8px;
    background: rgba(160,210,40,0.18); color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
  }

  /* ---------- Painel de leitura ---------- */

  .viewer-panel {
    display: none;
    background: #3d4547;
    border-radius: var(--radius);
    overflow: hidden;
    flex-direction: column;
    margin-top: 1.4rem;
  }
  .viewer-panel-header {
    background: var(--primary-dark); color: white;
    padding: 0.85rem 1.25rem;
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  }
  .viewer-panel-header h3 { font-size: 0.95rem; font-weight: 600; }
  .back-btn {
    background: rgba(255,255,255,0.14); border: none; color: white;
    font-size: 0.82rem; padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .back-btn:hover { background: rgba(255,255,255,0.24); }
  .viewer-body {
    position: relative; overflow: auto; display: flex; justify-content: center;
    padding: 1rem; user-select: none; min-height: 58vh; max-height: 66vh;
  }
  .viewer-body canvas { box-shadow: 0 4px 18px rgba(0,0,0,0.4); }
  .watermark {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-wrap: wrap; align-content: space-around; justify-content: space-around; opacity: 0.12;
  }
  .watermark span { transform: rotate(-30deg); font-size: 0.85rem; color: white; white-space: nowrap; }
  .viewer-controls {
    background: var(--primary-dark); color: white; padding: 0.6rem 1.25rem;
    display: flex; justify-content: center; align-items: center; gap: 1rem; font-size: 0.85rem;
  }
  .viewer-controls button {
    background: rgba(255,255,255,0.14); border: none; color: white;
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
  }
  .viewer-controls button:disabled { opacity: 0.4; cursor: default; }
  .viewer-status { font-size: 0.82rem; color: var(--sky); text-align: center; padding: 0.4rem; background: var(--primary-dark); }

  footer { text-align: center; padding: 1.5rem; font-size: 0.8rem; color: var(--text-muted); }

  @media (max-width: 720px) {
    .top-nav { order: 3; width: 100%; justify-content: flex-start; }
    .banner h1 { font-size: 1.4rem; }
  }

  @media print {
    body::before {
      content: "Impressão não autorizada — Casa dos Ventos";
      position: fixed; inset: 0; display:flex; align-items:center; justify-content:center;
      font-size: 2rem; z-index: 9999; background: white;
    }
    body > * { display: none !important; }
  }
</style>
</head>

  </div>

  <div id="categories"></div>

  <div class="viewer-panel" id="viewerPanel">
    <div class="viewer-panel-header">
      <h3 id="viewerTitle">Documento</h3>
      <button class="back-btn" onclick="closeViewer()">‹ Fechar leitura</button>
    </div>
    <div class="viewer-body" id="viewerBody">
      <canvas id="pdfCanvas"></canvas>
      <div class="watermark" id="watermark"></div>
    </div>
    <div class="viewer-status" id="viewerStatus"></div>
    <div class="viewer-controls">
      <button id="prevBtn" onclick="changePage(-1)">‹ Anterior</button>
      <span id="pageIndicator">Página 1 / 1</span>
      <button id="nextBtn" onclick="changePage(1)">Próxima ›</button>
    </div>
  </div>
</div>

<footer>Casa dos Ventos</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const SECTORS = [
  { id: "sso",          label: "Documentos de Saúde e Segurança Ocupacional - SSO" },
  { id: "meio-ambiente", label: "Documentos de Meio Ambiente" },
  { id: "esg",          label: "Relatórios e Documentos de ESG" },
  { id: "integridade",  label: "Códigos de Conduta e Políticas de Integridade" },
];

// Caminhos relativos apontando para a pasta pdfs/ dentro do projeto.
// Renomeie os arquivos reais para bater com esses nomes, ou ajuste aqui.
const DOCS = [
  { code: "PRO-001", title: "Inspeção Preventiva em Aerogeradores", sector: "sso",
    rev: "04", date: "15/01/2026", url: "pdfs/pro-001.pdf" },
  { code: "PRO-002", title: "Manutenção em Subestações Elétricas", sector: "sso",
    rev: "02", date: "10/02/2026", url: "pdfs/pro-002.pdf" },
  { code: "PRO-010", title: "Diretrizes de Segurança para Trabalho em Altura (NR-35)", sector: "sso",
    rev: "05", date: "20/02/2026", url: "pdfs/pro-010.pdf" },
  { code: "PRO-020", title: "Gestão de Resíduos Sólidos", sector: "meio-ambiente",
    rev: "01", date: "05/03/2026", url: "pdfs/pro-020.pdf" },
  { code: "REL-2025", title: "Relatório de Sustentabilidade 2025", sector: "esg",
    rev: "01", date: "15/06/2026", url: "pdfs/relatorio_sustentabilidade_2025.pdf" },
  { code: "PRO-040", title: "Código de Conduta e Compliance", sector: "integridade",
    rev: "03", date: "18/03/2026", url: "pdfs/pro-040.pdf" },
];

let openCategories = new Set();
let viewMode = 'grid';

function getTerm() {
  return document.getElementById('searchInput').value.trim().toLowerCase();
}

function docsForSector(sectorId, term) {
  return DOCS.filter(d => d.sector === sectorId &&
    (!term || d.title.toLowerCase().includes(term) || d.code.toLowerCase().includes(term)));
}

function renderCategories() {
  const term = getTerm();
  const wrap = document.getElementById('categories');

  wrap.innerHTML = SECTORS.map((s, i) => {
    const matches = docsForSector(s.id, term);
    const isOpen = openCategories.has(s.id) || (term && matches.length > 0);
    const bodyHtml = matches.length
      ? (viewMode === 'grid' ? renderGrid(matches) : renderList(matches))
      : `<div class="empty-state">Nenhum procedimento encontrado nesta categoria.</div>`;

    return `
      <div class="category ${isOpen ? 'open' : ''}" data-sector="${s.id}">
        <div class="category-head" data-toggle="${s.id}">
          <span class="category-index">${i + 1}</span>
          <span class="category-title">${s.label}</span>
          <span class="category-count">${matches.length}</span>
          <span class="chevron">▶</span>
        </div>
        <div class="category-body">${bodyHtml}</div>
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('.category-head').forEach(head => {
    head.addEventListener('click', () => toggleCategory(head.dataset.toggle));
  });
  wrap.querySelectorAll('[data-doc]').forEach(el => {
    el.addEventListener('click', () => {
      const doc = DOCS[Number(el.dataset.doc)];
      openViewer(`${doc.code} — ${doc.title}`, doc.url);
    });
  });
}

function renderList(docs) {
  return `<div class="doc-list">` + docs.map(d => `
    <div class="doc-row" data-doc="${DOCS.indexOf(d)}">
      <div>
        <span class="doc-code mono">${d.code}</span>
        <div class="doc-title">${d.title}</div>
        <div class="doc-meta">Rev. ${d.rev} · Atualizado em ${d.date}</div>
      </div>
      <span class="doc-open">Ler ›</span>
    </div>
  `).join('') + `</div>`;
}

function renderGrid(docs) {
  return `<div class="doc-grid">` + docs.map(d => `
    <div class="doc-card" data-doc="${DOCS.indexOf(d)}">
      <div class="doc-card-icon">📄</div>
      <span class="doc-code mono">${d.code}</span>
      <div class="doc-title">${d.title}</div>
      <div class="doc-meta">Rev. ${d.rev} · ${d.date}</div>
    </div>
  `).join('') + `</div>`;
}

function toggleCategory(sectorId) {
  if (openCategories.has(sectorId)) openCategories.delete(sectorId);
  else openCategories.add(sectorId);
  renderCategories();
}

function setView(mode) {
  viewMode = mode;
  document.getElementById('gridBtn').classList.toggle('active', mode === 'grid');
  document.getElementById('listBtn').classList.toggle('active', mode === 'list');
  renderCategories();
}

function onSearchInput() { renderCategories(); }

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let currentPdf = null;
let currentPage = 1;

async function openViewer(title, url) {
  const panel = document.getElementById('viewerPanel');
  panel.style.display = 'flex';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

  document.getElementById('viewerTitle').textContent = title;
  document.getElementById('viewerStatus').textContent = 'Carregando documento...';

  const canvas = document.getElementById('pdfCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  buildWatermark();

  try {
    currentPdf = await pdfjsLib.getDocument(url).promise;
    currentPage = 1;
    document.getElementById('viewerStatus').textContent = '';
    renderPage(currentPage);
  } catch (err) {
    document.getElementById('viewerStatus').innerHTML =
      `Erro ao carregar o arquivo PDF. Verifique se o caminho está correto e se a página
       está sendo servida via http/https (não abra o arquivo diretamente com file://).`;
  }
}

async function renderPage(num) {
  const page = await currentPdf.getPage(num);
  const canvas = document.getElementById('pdfCanvas');
  const ctx = canvas.getContext('2d');
  const viewport = page.getViewport({ scale: 1.4 });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: ctx, viewport }).promise;

  document.getElementById('pageIndicator').textContent = `Página ${num} / ${currentPdf.numPages}`;
  document.getElementById('prevBtn').disabled = num <= 1;
  document.getElementById('nextBtn').disabled = num >= currentPdf.numPages;
}

function changePage(delta) {
  if (!currentPdf) return;
  const next = currentPage + delta;
  if (next < 1 || next > currentPdf.numPages) return;
  currentPage = next;
  renderPage(currentPage);
}

function buildWatermark() {
  const wm = document.getElementById('watermark');
  const label = 'CASA DOS VENTOS · CONSULTA ONLINE · ' + new Date().toLocaleDateString('pt-BR');
  wm.innerHTML = Array.from({ length: 12 }).map(() => `<span>${label}</span>`).join('');
}

function closeViewer() {
  document.getElementById('viewerPanel').style.display = 'none';
  currentPdf = null;
}

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u'].includes(e.key.toLowerCase())) {
    e.preventDefault();
    alert('Cópia, gravação ou impressão não são permitidas para este documento.');
  }
});

renderCategories();
</script>
</body>
</html>
